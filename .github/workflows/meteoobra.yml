name: MeteoObra - Previsao diaria

on:
  schedule:
    - cron: "30 22 * * *"
      timezone: "Europe/Lisbon"
  workflow_dispatch:

jobs:
  previsao:
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Executar MeteoObra
        run: python meteoobra.py

      - name: Enviar previsao por email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          msg = EmailMessage()
          msg["Subject"] = "MeteoObra - Previsao do tempo"
          msg["From"] = os.environ["GMAIL_ADDRESS"]
          msg["To"] = os.environ["GMAIL_ADDRESS"]
          msg.set_content(
              "O MeteoObra executou a previsao meteorologica. "
              "Consulta os registos do GitHub Actions para ver os detalhes."
          )

          with smtplib.SMTP("smtp.gmail.com", 587) as smtp:
              smtp.starttls()
              smtp.login(
                  os.environ["GMAIL_ADDRESS"],
                  os.environ["GMAIL_APP_PASSWORD"]
              )
              smtp.send_message(msg)

          print("Email enviado com sucesso.")
          PY
