
name: MeteoObra - Previsao diaria

on:
  schedule:
    - cron: "0 23 * * *"
      timezone: "Europe/Lisbon"
  workflow_dispatch:

jobs:
  previsao:
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Gerar previsao
        run: python meteoobra.py > previsao.txt

      - name: Enviar previsao por email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          mensagem = Path("previsao.txt").read_text(encoding="utf-8")

          email = EmailMessage()
          email["Subject"] = "MeteoObra - Previsao do tempo para Lisboa"
          email["From"] = os.environ["GMAIL_ADDRESS"]
          email["To"] = os.environ["GMAIL_ADDRESS"]
          email.set_content(mensagem)

          with smtplib.SMTP("smtp.gmail.com", 587) as smtp:
              smtp.starttls()
              smtp.login(
                  os.environ["GMAIL_ADDRESS"],
                  os.environ["GMAIL_APP_PASSWORD"]
              )
              smtp.send_message(email)

          print("Previsao meteorologica enviada por email.")
          PY
